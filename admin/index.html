<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Lista Mirai</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../styles.css?v=1791496858">
  <link rel="stylesheet" href="admin.css?v=1791496858">
</head>
<body class="admin">
  <section id="login" class="prop-page" hidden>
    <form class="prop-card" id="login-form">
      <h1>Area admin</h1>
      <p class="sub">Accedi per gestire i QR code e leggere le proposte.</p>
      <div id="setup" class="msg err" hidden></div>
      <label for="em">Email</label>
      <input id="em" type="text" inputmode="email" autocomplete="username" required>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div id="login-err" class="msg err" role="alert" hidden></div>
      <button class="btn btn-primary" style="width:100%;margin-top:18px">Entra</button>
    </form>
  </section>

  <div id="app" hidden>
    <header class="admin-bar">
      <div class="wrap bar-in">
        <strong class="logo">Mirai · Admin</strong>
        <nav class="tabs" role="tablist" aria-label="Sezioni">
          <button role="tab" data-tab="qr" aria-selected="true">QR code</button>
          <button role="tab" data-tab="props" aria-selected="false">Proposte <span class="badge" id="new-count" hidden></span></button>
        </nav>
        <button class="btn-link" id="logout">Esci</button>
      </div>
    </header>

    <main class="wrap admin-main">
      <!-- QR -->
      <section id="tab-qr">
        <div class="panel">
          <h2>Crea un nuovo QR</h2>
          <p class="hint" id="qr-base"></p>
          <p class="hint">Dai un nome al punto della scuola dove lo appenderai: così vedi da dove arrivano le idee.</p>
          <form id="qr-form" class="row">
            <label class="sr-only" for="qr-label">Posizione</label>
            <input id="qr-label" type="text" maxlength="60" placeholder="Es. Atrio piano terra, Bagni 2° piano, Mensa…" required>
            <button class="btn btn-primary">Genera QR</button>
          </form>
          <div id="qr-err" class="msg err" hidden></div>
        </div>
        <div class="toolbar">
          <h2>I tuoi QR <span id="qr-total" class="muted"></span></h2>
          <div class="row"><button class="btn btn-primary" id="pdf-all">⬇ Tutti i fogli A4 (PDF)</button><button class="btn btn-violet" id="print-all">🖨️ Stampa tutti</button></div>
        </div>
        <div id="qr-list" class="qr-grid"></div>
      </section>

      <!-- Proposte -->
      <section id="tab-props" hidden>
        <div class="toolbar">
          <h2>Proposte <span id="p-total" class="muted"></span></h2>
          <div class="row">
            <label class="sr-only" for="f-status">Stato</label>
            <select id="f-status"><option value="">Tutti gli stati</option></select>
            <label class="sr-only" for="f-cat">Categoria</label>
            <select id="f-cat"><option value="">Tutte le categorie</option></select>
            <button class="btn btn-violet" id="csv" type="button">⬇ CSV</button>
          </div>
        </div>
        <div id="p-list" class="p-list"></div>
      </section>
    </main>
  </div>

  <!-- area stampa: riempita da JS -->
  <div id="print-area" aria-hidden="true"></div>
  <script src="../vendor/qrcode.js?v=1791496858"></script>
  <script src="../core.js?v=1791496858"></script>
  <script src="sheet.js?v=1791496858"></script>
  <script src="admin.js?v=1791496858"></script>
</body>
</html>
