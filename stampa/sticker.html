<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Adesivo rotondo Ø 80 mm: file quadrato 84 x 84 mm (2 mm di abbondanza per lato), sfondo fino al bordo */
@page{size:84mm 84mm;margin:0}
.page{width:84mm;height:84mm;background:var(--gold)}
.sc{position:absolute;left:0;top:0;width:600px;height:600px;transform:scale(.52913);transform-origin:0 0}
.disc{position:absolute;left:50%;top:50%;width:571px;height:571px;margin:-285.5px 0 0 -285.5px;border-radius:50%;overflow:hidden;
 background:radial-gradient(380px 320px at 85% 5%,rgba(255,196,46,.38),transparent 62%),radial-gradient(380px 380px at 0% 100%,rgba(124,58,237,.8),transparent 60%),#1d0a45;
 box-shadow:inset 0 0 0 13px var(--gold),inset 0 0 0 16px #1d0a45,inset 0 0 0 18px rgba(255,196,46,.7)}
.inner{position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;transform:scale(.93)}
.ring{position:absolute;inset:0;width:100%;height:100%}
.ring text{font:400 52px "Anton";letter-spacing:.14em;text-transform:uppercase}
.fox{position:absolute;left:50%;top:92px;width:80px;transform:translateX(-50%);z-index:3}
.card{position:absolute;left:50%;top:306px;transform:translate(-50%,-50%);width:290px;height:290px;background:#fff;border-radius:34px;padding:18px;box-shadow:0 20px 34px -14px rgba(0,0,0,.7)}
.card .qr{width:100%;height:100%}
.at{position:absolute;left:50%;top:436px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font:800 22px "DM Sans";letter-spacing:.02em;padding:8px 22px;border-radius:99px;white-space:nowrap;box-shadow:0 10px 20px -8px rgba(0,0,0,.7)}
</style></head><body>
<div class="page" id="p"><div class="sc"><div class="disc"><div class="inner">
 <svg class="ring" viewBox="0 0 600 600" aria-hidden="true">
  <defs><path id="top" d="M 68 300 A 232 232 0 0 1 532 300"/><path id="bot" d="M 38 300 A 262 262 0 0 0 562 300"/></defs>
  <text fill="#ffc42e" text-anchor="middle"><textPath href="#top" startOffset="50%">Lista Mirai</textPath></text>
  <text fill="#fff" text-anchor="middle" style="font-size:40px;letter-spacing:.2em"><textPath href="#bot" startOffset="50%">Galileo Galilei</textPath></text>
 </svg>
 <img class="fox" src="../assets/fox.png" alt="">
 <div class="card"><div class="qr" id="qr"></div></div>
 <div class="at">@lista.mirai</div>
</div></div></div></div>
<script src="qrcode.js"></script><script src="qr.js"></script>
<script>drawQR(document.getElementById('qr'),'https://www.instagram.com/lista.mirai');</script>
</body></html>
